<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AtomCode Proxy</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f5f5f5; color:#333; }
header { background:#1a1a2e; color:#fff; padding:16px 24px; }
header h1 { font-size:20px; }
nav { display:flex; gap:8px; padding:8px 24px; background:#fff; border-bottom:1px solid #e0e0e0; }
nav a { padding:6px 16px; text-decoration:none; color:#666; border-radius:4px; }
nav a.active { color:#1a1a2e; font-weight:600; }
.content { padding:24px; max-width:1200px; margin:0 auto; }
.card { background:#fff; border-radius:8px; padding:20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
.card h3 { font-size:14px; color:#888; margin-bottom:8px; }
.stat-value { font-size:32px; font-weight:700; color:#1a1a2e; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; }
table { width:100%; border-collapse:collapse; }
th,td { text-align:left; padding:8px 12px; border-bottom:1px solid #eee; }
th { color:#888; font-weight:600; font-size:12px; text-transform:uppercase; }
.badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:600; }
.badge.ok { background:#e6f7e6; color:#2e7d32; }
.badge.err { background:#fde8e8; color:#c62828; }
pre { background:#f5f5f5; padding:12px; border-radius:4px; overflow-x:auto; font-size:13px; }
</style>
</head>
<body>
<header><h1>🔌 AtomCode Proxy</h1></header>
<nav>
<a href="#dashboard" class="active" onclick="showTab('dashboard')">Dashboard</a>
<a href="#accounts" onclick="showTab('accounts')">Accounts</a>
<a href="#logs" onclick="showTab('logs')">Request Logs</a>
<a href="#settings" onclick="showTab('settings')">Settings</a>
</nav>
<div class="content" id="app"></div>
<script>
let state = { stats: null, accounts: [], logs: [], settings: {} };

function showTab(name) {
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
  document.querySelector(`nav a[href="#${name}"]`)?.classList.add('active');
  render(name);
}

async function api(path) {
  const r = await fetch(path);
  return r.json();
}

async function loadAll() {
  try { state.stats = await api('/api/stats'); } catch(e) {}
  try { state.accounts = await api('/api/accounts'); } catch(e) {}
  try { state.logs = await api('/api/logs'); } catch(e) {}
  try { state.settings = await api('/api/settings'); } catch(e) {}
  render('dashboard');
}

function render(tab) {
  const app = document.getElementById('app');
  if (tab === 'dashboard') renderDashboard(app);
  else if (tab === 'accounts') renderAccounts(app);
  else if (tab === 'logs') renderLogs(app);
  else if (tab === 'settings') renderSettings(app);
  else renderDashboard(app);
}

function renderDashboard(el) {
  const s = state.stats || {};
  el.innerHTML = `
    <div class="grid">
      <div class="card"><h3>Today Requests</h3><div class="stat-value">${s.total_requests || 0}</div></div>
      <div class="card"><h3>Input Tokens</h3><div class="stat-value">${s.total_input_tokens || 0}</div></div>
      <div class="card"><h3>Output Tokens</h3><div class="stat-value">${s.total_output_tokens || 0}</div></div>
      <div class="card"><h3>Accounts</h3><div class="stat-value">${s.accounts_count || 0}</div></div>
    </div>
    <div class="card">
      <h3>Requests by Model</h3>
      <table>${(s.by_model || []).map(m => `<tr><td>${m.model}</td><td>${m.count}</td></tr>`).join('')}</table>
    </div>
    <div class="card">
      <h3>Status</h3>
      <div id="health-status">Loading...</div>
    </div>
  `;
  api('/health').then(r => {
    document.getElementById('health-status').innerHTML =
      `<span class="badge ${r.status === 'ok' ? 'ok' : 'err'}">${r.status}</span> Daemon: ${r.daemon?.connected ? '✅' : '❌'}`;
  });
}

function renderAccounts(el) {
  const accts = state.accounts || [];
  el.innerHTML = `
    <div class="card">
      <h3>Accounts (${accts.length})</h3>
      <table>
        <tr><th>User</th><th>Model</th><th>Created</th></tr>
        ${accts.map(a => `<tr><td>${a.nickname || a.user_id}</td><td>${a.default_model || '-'}</td><td>${a.created_at || '-'}</td></tr>`).join('')}
      </table>
    </div>
  `;
}

function renderLogs(el) {
  const logs = state.logs || [];
  el.innerHTML = `
    <div class="card">
      <h3>Recent Requests (${logs.length})</h3>
      <table>
        <tr><th>Model</th><th>Endpoint</th><th>Status</th><th>Latency</th><th>Time</th></tr>
        ${logs.map(l => `<tr><td>${l.model || '-'}</td><td>${l.endpoint}</td><td><span class="badge ${l.status_code < 400 ? 'ok' : 'err'}">${l.status_code}</span></td><td>${l.latency_ms}ms</td><td>${l.created_at || ''}</td></tr>`).join('')}
      </table>
    </div>
  `;
}

function renderSettings(el) {
  const s = state.settings || {};
  el.innerHTML = `
    <div class="card">
      <h3>Settings</h3>
      <table>
        <tr><th>Key</th><th>Value</th></tr>
        ${Object.entries(s).map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}
      </table>
    </div>
  `;
}

loadAll();
</script>
</body>
</html>
