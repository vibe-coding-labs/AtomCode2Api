# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # Build frontend first, embedding into Go binary via //go:embed
    - sh -c "cd web && npm ci && npm run build"
    - go mod tidy

builds:
  # ========== Linux ==========
  # Linux amd64 (x86_64) — CGO enabled for SQLite
  - id: linux-amd64
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=1
      - CC=gcc
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # Linux arm64 (aarch64, Raspberry Pi 4/5, AWS Graviton)
  - id: linux-arm64
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # Linux armhf (arm 32-bit, Raspberry Pi 0-3)
  - id: linux-armhf
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=1
      - CC=arm-linux-gnueabihf-gcc
    goos:
      - linux
    goarch:
      - arm
    goarm:
      - "7"
      - "6"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # Linux 386 (32-bit)
  - id: linux-386
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=1
      - CC=gcc
    goos:
      - linux
    goarch:
      - "386"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # Linux riscv64 (open-source hardware)
  - id: linux-riscv64
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - riscv64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # Linux ppc64le (PowerPC, IBM POWER)
  - id: linux-ppc64le
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - ppc64le
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # Linux s390x (IBM mainframe)
  - id: linux-s390x
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - s390x
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # ========== Windows ==========
  # Windows amd64
  - id: windows-amd64
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # Windows 386
  - id: windows-386
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=1
      - CC=i686-w64-mingw32-gcc
    goos:
      - windows
    goarch:
      - "386"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # Windows arm64 (ARM Surface, etc.)
  - id: windows-arm64
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # ========== macOS (Darwin) ==========
  # Intel Macs
  - id: darwin-amd64
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # Apple Silicon Macs
  - id: darwin-arm64
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # ========== BSD ==========
  # FreeBSD amd64
  - id: freebsd-amd64
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=0
    goos:
      - freebsd
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # OpenBSD amd64
  - id: openbsd-amd64
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=0
    goos:
      - openbsd
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm" }}armhf
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).