# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # Build frontend first, embedding into Go binary via //go:embed
    - sh -c "cd web && npm ci && npm run build"
    - go mod tidy

builds:
  # Linux amd64
  - id: linux-amd64
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=1
      - CC=gcc
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # Linux arm64
  - id: linux-arm64
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # Linux 386
  - id: linux-386
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=1
      - CC=gcc
    goos:
      - linux
    goarch:
      - "386"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # Windows amd64
  - id: windows-amd64
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # Windows 386
  - id: windows-386
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=1
      - CC=i686-w64-mingw32-gcc
    goos:
      - windows
    goarch:
      - "386"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # Darwin amd64 (requires macOS or osxcross for CGO)
  - id: darwin-amd64
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

  # Darwin arm64 (requires macOS or osxcross for CGO)
  - id: darwin-arm64
    main: ./cmd/atomcode-2api/
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).